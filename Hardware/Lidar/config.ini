# Settings for lidar_hits.py, the program that turns the wall sensor's scans into HIT messages.
#
# Left, right, bottom and top are as seen by a player facing the wall. Lengths use the units set
# below. Measuring to within a few centimeters (an inch or two) is plenty: the game's own
# calibration (F9) takes care of the rest.

[screen]
# feet, inches, meters or centimeters
units = feet

# The size of the projected picture on the wall.
width = 8
height = 4

[sensor]
# Where the sensor sits, measured from the bottom left corner of the picture.
# The middle of the top edge is x = half the width, y = the full height.
x = 4
y = 4

# The angle the sensor itself shows (the scale printed around it, -45 to 225) that points straight
# down the wall, away from the top edge. With the sensor on the top edge and its 90 mark pointing
# down, this is 90.
down_angle = 90

# Which way the sensor's angles increase as the player sees them: clockwise or counterclockwise.
# If left and right come out swapped, change this.
angles_increase = counterclockwise

[detection]
# Something this far outside the picture still counts as a hit (same units as above), because a
# ball can land just off the edge.
margin = 1

# At the start the program looks at the empty scan for this many seconds. Keep the area in front
# of the wall clear until it says it is ready.
learn_seconds = 5

# A point only counts when it is this much closer than in the empty scan (millimeters).
distance_margin_mm = 100

# This many neighbouring points make an object. A ball is far wider than this at any distance in
# the booth, so a smaller number only finds more false alarms.
min_points = 5

# Sightings closer together in time than this (seconds) are the same ball, so a ball that bounces
# back through the scan is still one hit. Raise it if one ball sometimes counts twice.
same_ball_seconds = 0.6

# Something that stays in view this long (seconds) is not a ball. The program then treats it as
# part of the scene and carries on.
stuck_seconds = 2

[game]
# The PC that runs the game, and the TCP port its hardware link listens on.
host = 127.0.0.1
port = 9000

[lidar]
# The sensor itself. See Hardware/README.md.
host = 192.168.0.10
port = 2112
